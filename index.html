<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>練習出欠確認</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F766E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出欠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy: #1F5C99;
    --navy-dark: #17456F;
    --light-blue: #F2F7FC;
    --border: #D8E4F0;
    --ok: #2E8B57;
    --late: #B8860B;
    --early: #C0682B;
    --absent: #B0413E;
    --other: #6B5B95;
    --muted: #7C8A99;
    --text: #2A3540;
  }
  *{box-sizing:border-box;}
  button, .chip, .cal-day, .link-btn, .remove-child{touch-action:manipulation;}
  body{margin:0;font-family:Arial,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--light-blue);color:var(--text);min-height:100vh;}
  .header{background:var(--navy);color:#fff;padding:20px 20px 34px;position:relative;overflow:hidden;}
  .header h1{margin:0;font-size:18px;font-weight:700;padding-right:78px;}
  .header p{margin:6px 0 0;font-size:12px;opacity:0.85;}
  .shuttle{position:absolute;right:-10px;top:-14px;width:70px;height:70px;opacity:0.18;}
  .export-png-btn{
    position:absolute;top:12px;right:12px;z-index:2;max-width:72px;white-space:normal;line-height:1.3;
    background:rgba(255,255,255,0.18);color:#fff;border:1.5px solid rgba(255,255,255,0.6);
    border-radius:8px;padding:5px 8px;font-size:10.5px;font-weight:700;cursor:pointer;touch-action:manipulation;
  }
  .png-modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;
    align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 10px;
  }
  .png-modal-inner{background:#fff;border-radius:12px;padding:12px;max-width:100%;text-align:center;}
  .png-modal-btns{display:flex;gap:8px;justify-content:center;margin-bottom:8px;}
  .png-modal-save{
    background:#16A34A;color:#fff;border:none;
    border-radius:8px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation;
  }
  .png-modal-close{
    background:var(--navy);color:#fff;border:none;
    border-radius:8px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation;
  }
  .png-modal-hint{font-size:11.5px;color:var(--muted);margin-bottom:8px;}
  .png-modal-inner img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--border);}
  .wrap{max-width:520px;margin:-22px auto 0;padding:0 14px 40px;position:relative;z-index:1;}
  .card{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(31,92,153,0.08);padding:16px;margin-bottom:14px;}
  .card h2{font-size:13px;color:var(--navy);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .card h2::before{content:"";width:4px;height:14px;background:var(--navy);border-radius:2px;display:inline-block;}
  label.field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input[type=text], input[type=month], input[type=time]{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14.5px;font-family:inherit;color:var(--text);background:#fff;
  }
  .field{margin-bottom:12px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .link-btn{background:none;border:none;color:var(--navy);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px;}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--muted);padding-bottom:2px;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;color:var(--muted);cursor:pointer;background:#fff;
  }
  .cal-day.blank{border:none;cursor:default;}
  .cal-day.day-mon, .cal-day.day-wed, .cal-day.day-thu, .cal-day.day-fri{color:var(--muted);}
  .cal-day.day-tue{color:#E8871E;font-weight:700;}
  .cal-day.day-sat{color:#1F5C99;font-weight:700;}
  .cal-day.day-sun, .cal-day.day-holiday{color:#C0392B;font-weight:700;}
  .cal-day.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;}
  .save-btn{margin-top:10px;width:100%;background:var(--navy);color:#fff;border:none;padding:10px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .clear-all-btn{margin-top:8px;width:100%;background:#fff;color:#C0392B;border:1.5px solid #C0392B;padding:9px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;touch-action:manipulation;}

  .detail-row{border:1.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;}
  .detail-row .detail-date{font-size:13px;font-weight:700;margin-bottom:8px;}
  .detail-row.day-mon, .detail-row.day-wed, .detail-row.day-thu, .detail-row.day-fri{border-left:4px solid var(--border);}
  .detail-row.day-tue{border-left:4px solid #E8871E;}
  .detail-row.day-sat{border-left:4px solid #1F5C99;}
  .detail-row.day-sun, .detail-row.day-holiday{border-left:4px solid #C0392B;}
  .detail-row.day-tue .detail-date{color:#E8871E;}
  .detail-row.day-sat .detail-date{color:#1F5C99;}
  .detail-row.day-sun .detail-date, .detail-row.day-holiday .detail-date{color:#C0392B;}
  .loc-radios{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .loc-radio{
    border:1.5px solid var(--border);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;
    cursor:pointer;color:var(--muted);background:#fff;touch-action:manipulation;
  }
  .loc-radio.on{border-color:var(--navy);background:var(--light-blue);color:var(--navy);}
  .loc-radio.on[data-loc="六コミ"], .loc-badge[data-loc="六コミ"]{border-color:#2563EB;background:#EAF0FE;color:#2563EB;}
  .loc-radio.on[data-loc="武道館"], .loc-badge[data-loc="武道館"]{border-color:#7C3AED;background:#F1EAFC;color:#7C3AED;}
  .loc-radio.on[data-loc="宝田"], .loc-badge[data-loc="宝田"]{border-color:#0D9488;background:#E3F5F3;color:#0D9488;}
  .loc-radio.on[data-loc="櫛スポ"], .loc-badge[data-loc="櫛スポ"]{border-color:#EA580C;background:#FDEEE4;color:#EA580C;}
  .loc-radio.on[data-loc="羽黒体"], .loc-badge[data-loc="羽黒体"]{border-color:#16A34A;background:#E7F7ED;color:#16A34A;}
  .loc-radio.on[data-loc="藤島体"], .loc-badge[data-loc="藤島体"]{border-color:#DB2777;background:#FCE9F1;color:#DB2777;}
  .loc-radio.on[data-loc="アリーナ"], .loc-badge[data-loc="アリーナ"]{border-color:#4F46E5;background:#EBEAFC;color:#4F46E5;}
  .loc-radio.on[data-loc="多目的"], .loc-badge[data-loc="多目的"]{border-color:#B45309;background:#FBF0E4;color:#B45309;}
  .loc-radio.on[data-loc="カスタム"], .loc-badge[data-loc="カスタム"]{border-color:#57534E;background:#F0EFED;color:#57534E;}
  .loc-badge{display:inline-block;border:1.5px solid var(--border);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:700;margin-right:6px;}
  .detail-row input[type=time]{width:120px;margin-bottom:8px;}
  .time-range{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .allday-btn{
    border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;
    color:var(--muted);background:#fff;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .allday-btn.on{border-color:#16A34A;background:#E7F7ED;color:#16A34A;}
  .time-range input[type=time]{margin-bottom:0;}
  .time-range .tlabel{font-size:12px;color:var(--muted);}
  .detail-row input[type=text]{width:100%;}
  .summary-textarea{
    width:100%;min-height:70px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
    font-size:13.5px;font-family:inherit;color:var(--text);background:#fff;resize:vertical;
  }
  #announcementCard ul{margin:0 0 10px;padding-left:18px;font-size:13px;color:var(--text);}
  #announcementCard .announce-label{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .date-meta{font-size:13.5px;font-weight:600;color:var(--muted);margin:-2px 0 8px;}
  .date-note{
    background:#FFF7E0;border-left:3px solid var(--late);border-radius:6px;
    padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--text);margin:0 0 8px;
  }
  .duty-line{
    background:#EFECF5;border-left:3px solid var(--other);border-radius:6px;
    padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--text);margin:8px 0 0;
  }

  .slot-card{border:1.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff;}
  .slot-card.slot-color-0{border-left:4px solid var(--navy);}
  .slot-card.slot-color-1{border-left:4px solid #C0682B;}
  .slot-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .slot-title{font-size:12.5px;font-weight:700;color:var(--navy);}
  .slot-color-1 .slot-title{color:#C0682B;}
  .remove-slot-btn{background:none;border:none;color:var(--early);font-size:11.5px;cursor:pointer;touch-action:manipulation;}
  .add-slot-btn{
    width:100%;border:1.5px dashed var(--border);background:#fff;color:var(--navy);
    padding:8px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:8px;touch-action:manipulation;
  }
  .cat-chips, .coach-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .cat-chip, .coach-chip{
    border:1.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:700;
    cursor:pointer;color:var(--muted);background:#fff;touch-action:manipulation;
  }
  .cat-chip.on[data-cat="1班"], .cat-badge[data-cat="1班"]{border-color:#2563EB;background:#EAF0FE;color:#2563EB;}
  .cat-chip.on[data-cat="2班"], .cat-badge[data-cat="2班"]{border-color:#7C3AED;background:#F1EAFC;color:#7C3AED;}
  .cat-chip.on[data-cat="3班"], .cat-badge[data-cat="3班"]{border-color:#0D9488;background:#E3F5F3;color:#0D9488;}
  .cat-chip.on[data-cat="全員"], .cat-badge[data-cat="全員"]{border-color:#16A34A;background:#E7F7ED;color:#16A34A;}
  .cat-chip.on[data-cat="選抜"], .cat-badge[data-cat="選抜"]{border-color:#EA580C;background:#FDEEE4;color:#EA580C;}
  .cat-chip.on[data-cat="オープン"], .cat-badge[data-cat="オープン"]{border-color:#DB2777;background:#FCE8F1;color:#DB2777;}
  .open-note{font-size:11.5px;font-weight:700;color:#B4235F;background:#FCE8F1;border-radius:6px;padding:4px 8px;margin:4px 0 8px;}
  .cat-chip.on[data-cat="カスタム"], .cat-badge[data-cat="カスタム"]{border-color:#57534E;background:#F0EFED;color:#57534E;}
  .coach-chip.on[data-coach="監督"], .coach-badge[data-coach="監督"]{border-color:#2563EB;background:#EAF0FE;color:#2563EB;}
  .coach-chip.on[data-coach="武田"], .coach-badge[data-coach="武田"]{border-color:#7C3AED;background:#F1EAFC;color:#7C3AED;}
  .coach-chip.on[data-coach="大川"], .coach-badge[data-coach="大川"]{border-color:#0D9488;background:#E3F5F3;color:#0D9488;}
  .coach-chip.on[data-coach="工藤"], .coach-badge[data-coach="工藤"]{border-color:#EA580C;background:#FDEEE4;color:#EA580C;}
  .coach-chip.on[data-coach="志布"], .coach-badge[data-coach="志布"]{border-color:#16A34A;background:#E7F7ED;color:#16A34A;}
  .coach-chip.on[data-coach="杉山"], .coach-badge[data-coach="杉山"]{border-color:#B45309;background:#FBF0E4;color:#B45309;}
  .coach-chip.on[data-coach="石黒"], .coach-badge[data-coach="石黒"]{border-color:#DB2777;background:#FCE9F1;color:#DB2777;}
  .coach-chip.on[data-coach="カスタム"], .coach-badge[data-coach="カスタム"]{border-color:#57534E;background:#F0EFED;color:#57534E;}
  .cat-badge, .coach-badge{
    display:inline-block;border:1.5px solid var(--border);border-radius:10px;padding:1px 8px;
    font-size:10.5px;font-weight:700;margin-right:5px;
  }
  .cat-line{margin:0 0 8px;}
  .coach-line{font-size:11.5px;color:var(--muted);margin:-2px 0 8px;}
  .school-note-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .school-note-chip{
    border:1.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:700;
    cursor:pointer;color:var(--muted);background:#fff;touch-action:manipulation;
  }
  .school-note-chip.on{border-color:#C0392B;background:#FBE9E8;color:#C0392B;}
  .school-note-line{margin:-2px 0 8px;}
  .school-note-badge{
    display:inline-block;border:1.5px solid #C0392B;border-radius:10px;padding:1px 8px;
    font-size:10.5px;font-weight:700;color:#C0392B;background:#FBE9E8;margin-right:5px;
  }

  .slot-attend-block{border:1.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;}
  .slot-attend-block.slot-color-0{border-left:4px solid var(--navy);}
  .slot-attend-block.slot-color-1{border-left:4px solid #C0682B;}
  .slot-attend-block .slot-title{margin-bottom:6px;}

  .child-block{border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;}
  .child-block .row-between{margin-bottom:10px;}
  .remove-child{color:var(--early);background:none;border:none;font-size:12px;cursor:pointer;touch-action:manipulation;}
  .clear-child-btn{
    margin-top:10px;width:100%;background:#fff;color:#C0392B;border:1.5px solid #C0392B;
    padding:8px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation;
  }
  .date-row{border-bottom:1px solid var(--border);padding:10px 2px;}
  .date-row:last-child{border-bottom:none;}
  .date-row .date-label{font-size:15.5px;font-weight:700;margin-bottom:6px;}
  .date-row.day-mon, .summary-date.day-mon,
  .date-row.day-wed, .summary-date.day-wed,
  .date-row.day-thu, .summary-date.day-thu,
  .date-row.day-fri, .summary-date.day-fri{border-left:4px solid var(--border);padding-left:8px;}
  .date-row.day-tue, .summary-date.day-tue{border-left:4px solid #E8871E;padding-left:8px;}
  .date-row.day-sat, .summary-date.day-sat{border-left:4px solid #1F5C99;padding-left:8px;}
  .date-row.day-sun, .summary-date.day-sun, .date-row.day-holiday, .summary-date.day-holiday{border-left:4px solid #C0392B;padding-left:8px;}
  .date-row.day-tue .date-label, .summary-date.day-tue .d-title{color:#E8871E;}
  .date-row.day-sat .date-label, .summary-date.day-sat .d-title{color:#1F5C99;}
  .date-row.day-sun .date-label, .summary-date.day-sun .d-title,
  .date-row.day-holiday .date-label, .summary-date.day-holiday .d-title{color:#C0392B;}
  .holiday-name{font-size:11px;font-weight:700;color:#C0392B;margin-left:6px;}
  .today-badge{
    display:inline-block;background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;
    border-radius:10px;padding:1px 9px;margin-left:8px;vertical-align:middle;
  }
  .next-badge{
    display:inline-block;background:#fff;color:var(--navy);border:1.5px solid var(--navy);
    font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 9px;margin-left:8px;vertical-align:middle;
  }
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);background:#fff;
  }
  .chip.on[data-type="attend"]{border-color:var(--ok);background:#EAF6EE;color:var(--ok);}
  .chip.on[data-type="absent"]{border-color:var(--absent);background:#FBE9E8;color:var(--absent);}
  .chip.on[data-type="late"]{border-color:var(--late);background:#FBF3E1;color:var(--late);}
  .chip.on[data-type="early"]{border-color:var(--early);background:#FCEDE4;color:var(--early);}
  .chip.on[data-type="other"]{border-color:var(--other);background:#EFECF5;color:var(--other);}
  .time-inline{display:none;align-items:center;gap:6px;margin-top:6px;}
  .time-inline.show{display:flex;}
  .time-inline input{width:120px;}
  .time-inline .tlabel{font-size:12px;color:var(--muted);}
  .other-inline{display:none;margin-top:6px;}
  .other-inline.show{display:block;}
  .other-inline input{width:100%;}

  .add-child-btn{width:100%;border:1.5px dashed var(--border);background:#fff;color:var(--navy);padding:10px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:12px;}
  .submit-btn{width:100%;background:var(--navy);color:#fff;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
  .status-msg{font-size:12.5px;text-align:center;margin-top:10px;color:var(--muted);}

  .answered-count{
    font-size:13px;font-weight:700;color:var(--navy);background:var(--light-blue);
    border-radius:8px;padding:8px 12px;margin-bottom:10px;
  }
  .summary-date{padding:10px 4px;border-bottom:1px solid var(--border);}
  .summary-date:last-child{border-bottom:none;}
  .summary-date .d-title{font-size:15.5px;font-weight:700;margin-bottom:8px;}
  .summary-date > .slot-color-0{border-left:4px solid var(--navy);padding:4px 0 8px 10px;margin-bottom:8px;}
  .summary-date > .slot-color-1{border-left:4px solid #C0682B;padding:4px 0 8px 10px;margin-bottom:8px;}
  .status-group{margin-bottom:8px;}
  .status-group:last-child{margin-bottom:0;}
  .status-group .group-label{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-bottom:5px;
  }
  .status-group .group-names{font-size:12.5px;color:var(--text);line-height:1.6;padding-left:2px;}
  .status-group .group-names .name-item{padding:2px 0;}
  .group-label.attend{background:#EAF6EE;color:var(--ok);}
  .group-label.absent{background:#FBE9E8;color:var(--absent);}
  .group-label.late{background:#FBF3E1;color:var(--late);}
  .group-label.early{background:#FCEDE4;color:var(--early);}
  .group-label.other{background:#EFECF5;color:var(--other);}
  .empty{text-align:center;color:var(--muted);font-size:12.5px;padding:14px 0;}
  .liff-note{font-size:11px;color:var(--muted);text-align:center;padding-top:2px;}


  /* --- 使いやすさ改善：大きい出席/欠席ボタン、日付カード、曜日の型 --- */
  .date-row .date-label{font-size:20px;font-weight:800;margin-bottom:8px;}
  .date-row .date-meta{font-size:15px;font-weight:700;color:var(--text);margin:0 0 10px;}
  .date-row.next-row{border:2px solid var(--navy);border-radius:12px;padding:10px 10px;background:var(--light-blue);margin-bottom:8px;}

let db = null, authReady = null;
function isFirebaseConfigured(){
  return !!FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith('ここ');
}
function initFirebase(){
  if(!isFirebaseConfigured() || typeof firebase === 'undefined'){
    authReady = Promise.reject(new Error('Firebaseの設定が未入力です'));
    authReady.catch(() => {});
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
  authReady = firebase.auth().signInAnonymously();
  authReady.catch(e => console.error(e));
}
function monthRef(orgId, ym){ return db.collection('orgs').doc(orgId).collection('months').doc(ym); }
function attendanceDocId(name){ return encodeURIComponent(name).replace(/\./g, '%2E'); }

async function apiGet(action, params){
  await authReady;
  const orgId = params.org || ORG.id; // 他団体の合同表示用に org を指定できる
  const ym = params.month;
  if(action === 'getPracticeDates'){
    const snap = await monthRef(orgId, ym).get();
    return { dates: (snap.exists && snap.data().dates) || [], events: (snap.exists && snap.data().events) || [] };
  }
  if(action === 'getMonthSummary'){
    const snap = await monthRef(orgId, ym).get();
    const d = snap.exists ? snap.data() : {};
    return { currentSummary: d.currentSummary || '', nextSummary: d.nextSummary || '' };
  }
  if(action === 'getAttendanceList'){
    const qs = await monthRef(orgId, ym).collection('attendance').get();
    return { submissions: qs.docs.map(doc => {
      const x = doc.data();
      return { name: x.name, submitterLineName: x.submitterLineName || '', days: x.days || {}, updatedAt: x.updatedAt || '' };
    }) };
  }
  throw new Error('unknown action: ' + action);
}
async function apiPost(payload){
  await authReady;
  const orgId = ORG.id;
  const ym = payload.month;
  const now = new Date().toISOString();
  if(payload.action === 'savePracticeDates'){
    await monthRef(orgId, ym).set({ dates: payload.dates, updatedAt: now }, { merge: true });
    return { ok: true };
  }
  if(payload.action === 'saveEvents'){
    await monthRef(orgId, ym).set({ events: payload.events || [], updatedAt: now }, { merge: true });
    return { ok: true };
  }
  if(payload.action === 'saveMonthSummary'){
    await monthRef(orgId, ym).set({ currentSummary: payload.currentSummary || '', nextSummary: payload.nextSummary || '', updatedAt: now }, { merge: true });
    return { ok: true };
  }
  if(payload.action === 'saveAttendance'){
    await monthRef(orgId, ym).collection('attendance').doc(attendanceDocId(payload.name)).set({
      name: payload.name, submitterLineName: payload.submitterLineName || '', days: payload.days || {}, updatedAt: now
    });
    return { ok: true };
  }
  if(payload.action === 'clearAttendance'){
    // 過去の日付の回答は残し、今日以降の回答だけ消す（全体状況・CSVの履歴を守る）
    const ref = monthRef(orgId, ym).collection('attendance').doc(attendanceDocId(payload.name));
    const snap = await ref.get();
    if(!snap.exists) return { ok: true };
    const t = new Date();
    const today = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
    const days = (snap.data() || {}).days || {};
    const keep = {};
    Object.keys(days).forEach(d => { if(d < today) keep[d] = days[d]; });
    if(Object.keys(keep).length === 0) await ref.delete();
    else await ref.update({ days: keep, updatedAt: new Date().toISOString() });
    return { ok: true };
  }
  throw new Error('unknown action: ' + payload.action);
}

// 同じ月の出欠一覧を複数箇所（全体状況・各お子様の前回回答復元）から取得する際、
// 通信を1回にまとめて共有するためのキャッシュ。
let attendanceListCache = { month: null, promise: null };
function getAttendanceListShared(ym){
  if(attendanceListCache.month === ym && attendanceListCache.promise){
    return attendanceListCache.promise;
  }
  const p = apiGet('getAttendanceList', { month: ym });
  attendanceListCache = { month: ym, promise: p };
  p.catch(() => { attendanceListCache = { month: null, promise: null }; }); // 失敗時は再取得できるようキャッシュを捨てる
  return p;
}
function invalidateAttendanceListCache(){
  attendanceListCache = { month: null, promise: null };
  otherOrgsCache = { key: null, promise: null };
}

// 同じ日・同じ会場の合同表示のため、他の団体の練習日程と出欠もまとめて取得して共有する。
let otherOrgsCache = { key: null, promise: null };
function getOtherOrgsShared(ym){
  const key = ORG.id + ':' + ym;
  if(otherOrgsCache.key === key && otherOrgsCache.promise) return otherOrgsCache.promise;
  const ids = ORG_ORDER.filter(id => id !== ORG.id);
  const p = Promise.all(ids.map(async id => {
    const [d, a] = await Promise.all([
      apiGet('getPracticeDates', { month: ym, org: id }),
      apiGet('getAttendanceList', { month: ym, org: id })
    ]);
    return { id, practiceDates: normalizePracticeDates(d.dates), submissions: a.submissions || [] };
  }));
  otherOrgsCache = { key, promise: p };
  p.catch(() => { otherOrgsCache = { key: null, promise: null }; });
  return p;
}
function venueLabelOf(slot, customKey){
  if(!slot || !slot.location) return '';
  return (slot.location === customKey && slot.customLocation) ? slot.customLocation : slot.location;
}
function sameVenue(slotA, customKeyA, slotB, customKeyB){
  const a = venueLabelOf(slotA, customKeyA), b = venueLabelOf(slotB, customKeyB);
  return !!a && a === b;
}

const WD = ['日','月','火','水','木','金','土'];

function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
document.getElementById('monthInput').value = currentMonthStr();

function daysInMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function firstWeekday(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).getDay();
}
function dateStr(ym, day){
  const [y,m] = ym.split('-').map(Number);
  return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function weekdayOf(dstr){
  return WD[new Date(dstr+'T00:00:00').getDay()];
}
function shortLabel(dstr){
  const parts = dstr.split('-');
  return `${parseInt(parts[1])}/${parseInt(parts[2])}(${weekdayOf(dstr)})`;
}

// 日本の祝日データ（年ごとにキャッシュ）
let holidaysCache = {};
async function loadHolidaysForYear(year){
  if(holidaysCache[year]) return holidaysCache[year];
  try{
    const res = await fetch(`https://holidays-jp.github.io/api/v1/${year}/date.json`);
    const data = await res.json();
    holidaysCache[year] = data || {};
  }catch(e){
    console.error(e);
    holidaysCache[year] = {};
  }
  return holidaysCache[year];
}
async function ensureHolidaysLoaded(dates){
  const years = new Set(dates.map(ds => ds.split('-')[0]));
  await Promise.all(Array.from(years).map(y => loadHolidaysForYear(y)));
}
function holidayNameFor(ds){
  const year = ds.split('-')[0];
  const map = holidaysCache[year];
  return map ? (map[ds] || null) : null;
}
function dayClassFor(ds){
  const holidayName = holidayNameFor(ds);
  if(holidayName) return 'day-holiday';
  const weekday = new Date(ds + 'T00:00:00').getDay();
  const map = ['day-sun', 'day-mon', 'day-tue', 'day-wed', 'day-thu', 'day-fri', 'day-sat'];
  return map[weekday];
}
function dateLabelWithHoliday(ds){
  const holidayName = holidayNameFor(ds);
  return `${shortLabel(ds)}${holidayName ? `<span class="holiday-name">${escapeHtml(holidayName)}</span>` : ''}`;
}

function getTodayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function computeNextPracticeDate(dates){
  const todayStr = getTodayStr();
  const upcoming = dates.filter(d => d >= todayStr).sort();
  return upcoming.length > 0 ? upcoming[0] : null;
}
function dateBadgeFor(ds, todayStr, nextDate){
  if(ds === todayStr) return '<span class="today-badge">今日</span>';
  if(ds === nextDate) return '<span class="next-badge">次回</span>';
  return '';
}

function defaultSlot(){

function defaultSlotForDate(ds){

  return base;
}

function tplToggleWd(i){ i = Number(i); tpl.wd.has(i) ? tpl.wd.delete(i) : tpl.wd.add(i); renderTplBox(); }
function tplSetLoc(l){ tpl.location = (tpl.location === l ? '' : l); renderTplBox(); }

function tplToggleCoach(c){ tpl.coaches.has(c) ? tpl.coaches.delete(c) : tpl.coaches.add(c); renderTplBox(); }
function monthDays(ym){
  const out = [];
  const total = daysInMonth(ym);
  for(let d = 1; d <= total; d++){
    const ds = dateStr(ym, d);
    out.push({ ds, wd: new Date(ds + 'T00:00:00').getDay() });
  }
  return out;
}
function applyTpl(){
  const ym = document.getElementById('monthInput').value;
  if(tpl.wd.size === 0){ alert('練習する曜日を選んでください。'); return; }
  if(!tpl.location){ alert('会場を選んでください。'); return; }
  const today = getTodayStr();
  let added = 0;
  monthDays(ym).forEach(({ ds, wd }) => {
    if(!tpl.wd.has(wd) || ds < today || adminSelection.has(ds)) return;
    adminSelection.set(ds, { parentDuty: '', slots: [{
      ...defaultSlot(), location: tpl.location, startTime: tpl.start, endTime: tpl.end,
      categories: Array.from(tpl.cats), coaches: Array.from(tpl.coaches)
    }] });
    added++;
  });
  renderCalGrid(); renderDateDetailList();
  alert(added ? `${added}日分を追加しました。内容を確認して「この月の練習日を保存」を押してください。` : '追加できる日がありませんでした（登録済み、または過ぎた日です）。');
}
async function copyLastMonth(){
  const ym = document.getElementById('monthInput').value;
  const [y, m] = ym.split('-').map(Number);
  const prev = new Date(y, m - 2, 1);
  const prevYm = prev.getFullYear() + '-' + String(prev.getMonth() + 1).padStart(2, '0');
  let prevDates = [];
  try{
    const r = await apiGet('getPracticeDates', { month: prevYm });
    prevDates = normalizePracticeDates(r.dates);
  }catch(e){ alert('先月の予定を読み込めませんでした。'); return; }
  if(prevDates.length === 0){ alert('先月の練習日が登録されていません。'); return; }
  // 曜日ごとに、先月いちばん後ろの日の内容を型として使う
  const byWd = {};
  prevDates.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(pd => {
    byWd[new Date(pd.date + 'T00:00:00').getDay()] = pd;
  });
  const today = getTodayStr();
  let added = 0;
  monthDays(ym).forEach(({ ds, wd }) => {
    const src = byWd[wd];
    if(!src || ds < today || adminSelection.has(ds)) return;
    adminSelection.set(ds, {
      parentDuty: '',
      slots: src.slots.map(sl => ({ ...sl, categories: [...(sl.categories || [])], coaches: [...(sl.coaches || [])], schoolNotes: [], message: '' }))
    });
    added++;
  });
  renderCalGrid(); renderDateDetailList();
  alert(added ? `先月の曜日・会場・時間をもとに${added}日分を追加しました。確認して「この月の練習日を保存」を押してください。` : '追加できる日がありませんでした（登録済み、または過ぎた日です）。');
}

function normalizeSlot(s){
  return {
    location: s.location || '', customLocation: s.customLocation || '',
    startTime: s.startTime || (s.time || ''), endTime: s.endTime || '',
    allDay: !!s.allDay,
    categories: Array.isArray(s.categories) ? s.categories : [],
    customCategory: s.customCategory || '',
    coaches: Array.isArray(s.coaches) ? s.coaches : [],
    customCoach: s.customCoach || '',
    message: s.message || '',
    schoolNotes: Array.isArray(s.schoolNotes) ? s.schoolNotes : []
  };
}
function normalizePracticeDates(raw){
  return (raw || []).map(item => {
    if(typeof item === 'string') return { date: item, parentDuty: '', slots: [defaultSlot()] };
    if(Array.isArray(item.slots)) return { date: item.date, parentDuty: item.parentDuty || '', slots: item.slots.map(normalizeSlot) };
    // legacy flat structure (no slots array) -> wrap as a single slot
    return { date: item.date, parentDuty: item.parentDuty || '', slots: [normalizeSlot(item)] };
  });
}

function renderMonthCal(){
  const grid = document.getElementById('mcGrid');
  if(!grid) return;
  const ym = document.getElementById('monthInput').value;
  if(!ym) return;
  const [y, m] = ym.split('-').map(Number);
  document.getElementById('mcTitle').textContent = `${y}年${m}月の練習`;
  const byDate = {};
  practiceDates.forEach(pd => { byDate[pd.date] = pd; });
  const today = getTodayStr();
  let html = WD.map((w, i) => `<div class="mc-wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  const offset = firstWeekday(ym);
  for(let i = 0; i < offset; i++) html += '<div class="mc-cell"></div>';
  const used = new Set();
  const evDaySet = eventDaysSet(monthEvents);
  const total = daysInMonth(ym);
  for(let d = 1; d <= total; d++){
    const ds = dateStr(ym, d);
    const pd = byDate[ds];
    const cls = ['mc-cell', dayClassFor(ds)];
    let body = '';
    if(pd){
      cls.push('has');
      pd.slots.forEach((sl, i) => {
        if(sl.location) used.add(sl.location);
        if(i === 0){
          const label = (sl.location === CUSTOM_LOC && sl.customLocation) ? sl.customLocation : sl.location;
          body += `<span class="loc-badge mc-loc" data-loc="${escapeHtml(sl.location || '')}">${escapeHtml(label || '')}</span>`;
          const t = shortTimeRange(sl); if(t) body += `<div class="mc-time">${escapeHtml(t)}</div>`;
          const c = coachShort(sl); if(c) body += `<div class="mc-coach">${escapeHtml(c)}</div>`;
        }
      });
      if(pd.slots.length > 1) body += `<div class="mc-more">他${pd.slots.length - 1}会場</div>`;
    }
    if(evDaySet.has(ds)){
      cls.push('evd');
      const names = monthEvents.filter(ev => ds >= ev.date && ds <= (ev.endDate && ev.endDate >= ev.date ? ev.endDate : ev.date)).map(ev => escapeHtml(ev.title));
      body += `<div class="mc-ev">🚩${names.join('<br>')}</div>`;
    }
    if(ds === today) cls.push('today');
    if(ds < today) cls.push('past');
    html += `<div class="${cls.join(' ')}" ${pd ? `onclick="jumpToDate('${ds}')"` : ''}><div class="mc-day">${d}</div>${body}</div>`;
  }
  grid.innerHTML = html;
  document.getElementById('mcLegend').innerHTML = Array.from(used).map(l => `<span class="loc-badge" data-loc="${escapeHtml(l)}">${escapeHtml(l)}</span>`).join('');
  document.getElementById('mcEvents').innerHTML = monthEvents.length ? monthEvents.slice().sort((a,b) => a.date.localeCompare(b.date)).map(eventLineHtml).join('') : '';

let monthEvents = [];

function normalizeEvents(raw){
  return (raw || []).filter(e => e && e.date && e.title).map(e => ({
    date: e.date, endDate: e.endDate || '', kind: e.kind || '行事', title: e.title, place: e.place || '', memo: e.memo || ''
  }));
}
function eventDaysSet(events){
  const s = new Set();
  events.forEach(ev => {
    const a = new Date(ev.date + 'T00:00:00');
    const b = new Date((ev.endDate && ev.endDate >= ev.date ? ev.endDate : ev.date) + 'T00:00:00');
    for(let d = new Date(a), n = 0; d <= b && n < 40; d.setDate(d.getDate() + 1), n++){
      s.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
    }
  });
  return s;
}
function md(ds){ const p = ds.split('-'); return `${Number(p[1])}/${Number(p[2])}`; }
function eventLabel(ev){
  const range = ev.endDate && ev.endDate > ev.date ? `${md(ev.date)}〜${md(ev.endDate)}` : md(ev.date);
  return `${range}（${weekdayOf(ev.date)}）`;
}
function eventLineHtml(ev){
  const icon = ev.kind === '大会' ? '🏆' : ev.kind === '練習会' ? '🏸' : '🚩';
  return `<div class="ev-line"><span class="ev-kind">${icon} ${escapeHtml(ev.kind)}</span><b>${escapeHtml(eventLabel(ev))}</b> ${escapeHtml(ev.title)}${ev.place ? `<span class="ev-sub">＠${escapeHtml(ev.place)}</span>` : ''}${ev.memo ? `<div class="ev-sub">${escapeHtml(ev.memo)}</div>` : ''}</div>`;
}

function fiscalStartYm(kind, year){ return kind === 'fy' ? `${year}-04` : `${year}-01`; }
function yrMonths(){

}
function cloneEntry(d){
  return { parentDuty: d.parentDuty || '', slots: d.slots.map(s => ({ ...s, categories: [...(s.categories||[])], coaches: [...(s.coaches||[])], schoolNotes: [...(s.schoolNotes||[])] })) };
}
function serializeMonth(map){
  return Array.from(map.entries()).sort((a,b) => a[0].localeCompare(b[0])).map(([date, d]) => ({
    date, parentDuty: d.parentDuty || '',
    slots: d.slots.map(s => ({
      location: s.location || '', customLocation: s.customLocation || '',
      startTime: s.startTime || '', endTime: s.endTime || '', allDay: !!s.allDay,
      categories: s.categories || [], customCategory: s.customCategory || '', coaches: s.coaches || [], customCoach: s.customCoach || '',
      message: s.message || '', schoolNotes: s.schoolNotes || []
    }))

}
function initialBlocks(){
  const groups = {};
  const usual = ORG.id === 'tsururoku' ? [0,2,4,6] : ORG.id === 'bc' ? [2,4] : [];
  usual.forEach(k => {

    (groups[key] = groups[key] || { wd: new Set(), location: w.location, start: w.startTime, end: w.endTime, cats: new Set(w.categories || ORG.defaultCategories), coaches: new Set(w.coaches || []) }).wd.add(Number(k));
  });
  const arr = Object.values(groups);
  return arr.length ? arr : [newBlock()];
}
function newBlock(){ return { wd: new Set(), location: '', start: '19:00', end: '21:00', cats: new Set(ORG.defaultCategories), coaches: new Set() }; }

async function loadYearData(){

  renderYear();
  const months = yrMonths();

function yrDirty(){

function yrBlockToggle(i, kind, v){

  else if(kind === 'loc'){ b.location = (b.location === v ? '' : v); }

function yrDelBlock(i){ yr.blocks.splice(i, 1); if(!yr.blocks.length) yr.blocks.push(newBlock()); renderYear(); }
function yrAddBreak(){ yr.breaks.push({ from: '', to: '', label: '' }); renderYear(); }
function yrDelBreak(i){ yr.breaks.splice(i, 1); renderYear(); }
function inBreak(ds){ return yr.breaks.some(b => b.from && ds >= b.from && ds <= (b.to || b.from)); }

function yrApplyBlocks(){
  const valid = yr.blocks.filter(b => b.wd.size && b.location);
  if(!valid.length){ alert('曜日と会場を選んだ型が1つもありません。'); return; }
  const today = getTodayStr();
  let added = 0;
  yrMonths().forEach(ym => {
    const map = yr.months.get(ym);
    monthDays(ym).forEach(({ ds, wd }) => {
      if(ds < today || map.has(ds)) return;
      if(inBreak(ds)){ yr.off.add(ds); return; }
      if(yr.skipHol && holidayNameFor(ds)) return;
      const b = valid.find(x => x.wd.has(wd));
      if(!b) return;
      map.set(ds, { parentDuty: '', slots: [{ ...defaultSlot(), location: b.location, startTime: b.start, endTime: b.end, categories: Array.from(b.cats), coaches: Array.from(b.coaches) }] });
      added++;
    });
  });
  renderYear();
  alert(`${added}日分を追加しました。下のカレンダーで確認し、例外の日をタップして直してください。`);
}
async function yrCopyLastYear(){
  const today = getTodayStr();
  let added = 0;
  const months = yrMonths();
  const prevs = await Promise.all(months.map(ym => {
    const [y, m] = ym.split('-');
    return apiGet('getPracticeDates', { month: `${Number(y) - 1}-${m}` }).catch(() => ({ dates: [] }));
  }));
  months.forEach((ym, i) => {
    const src = normalizePracticeDates(prevs[i].dates);
    const map = yr.months.get(ym);
    const first = new Date(dateStr(ym, 1) + 'T00:00:00').getDay();
    const total = daysInMonth(ym);
    src.forEach(pd => {
      const sd = new Date(pd.date + 'T00:00:00');
      const nth = Math.floor((sd.getDate() - 1) / 7);
      const day = 1 + ((sd.getDay() - first + 7) % 7) + nth * 7;
      if(day > total) return;
      const ds = dateStr(ym, day);
      if(ds < today || map.has(ds)) return;
      if(inBreak(ds)){ yr.off.add(ds); return; }
      if(yr.skipHol && holidayNameFor(ds)) return;
      map.set(ds, { parentDuty: '', slots: pd.slots.map(s => ({ ...s, categories: [...(s.categories||[])], coaches: [...(s.coaches||[])], message: '', schoolNotes: [] })) });
      added++;
    });
  });
  renderYear();
  alert(added ? `去年の同じ週・曜日から${added}日分をコピーしました。` : 'コピーできる日がありませんでした（去年のデータなし、または登録済み）。');
}
function yrDayTap(ds){
  const ym = ds.slice(0, 7);
  const map = yr.months.get(ym);
  if(!map) return;

async function yrSaveAll(){

  });

function yrMiniMonth(ym){
  const [y, m] = ym.split('-').map(Number);
  const map = yr.months.get(ym) || new Map();
  const evs = yr.events.get(ym) || [];
  const evDays = eventDaysSet(evs);
  let h = WD.map((w, i) => `<div class="yr-wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  for(let i = 0; i < firstWeekday(ym); i++) h += '<div></div>';
  const used = new Set();
  for(let d = 1; d <= daysInMonth(ym); d++){
    const ds = dateStr(ym, d);
    const ent = map.get(ds);
    let style = '', cls = 'yr-d';
    if(ent){
      const loc = ent.slots[0].location;
      used.add(loc);
      style = `background:${LOC_COLORS_PNG[loc] || '#57534E'};color:#fff;`;
    } else if(yr.off.has(ds)) cls += ' off';
    else if(holidayNameFor(ds)) cls += ' hol';
    if(evDays.has(ds)) cls += ' ev';
    h += `<div class="${cls}" style="${style}" onclick="yrDayTap('${ds}')">${d}</div>`;
  }
  const evHtml = evs.slice().sort((a,b) => a.date.localeCompare(b.date)).map(e => `<div class="yr-ev">🚩 ${escapeHtml(md(e.date))} ${escapeHtml(e.title)}</div>`).join('');
  const cnt = map.size;
  return `<div class="yr-month"><div class="yr-mh">${y !== Number(yr.startYm.slice(0,4)) || m === 1 ? `${y}年` : ''}${m}月<span>${cnt}日</span></div><div class="yr-grid">${h}</div>${evHtml}</div>`;
}

async function clearChildAttendance(id){
  const block = document.getElementById(id);
  if(!block) return;
  const nameEl = block.querySelector('.childName');
  const name = nameEl ? nameEl.value.trim() : '';
  if(!name){
    alert('お名前が入力されていません。');
    return;
  }
  const ym = document.getElementById('monthInput').value;
  if(!confirm(`${name}さんの${ym}分の回答のうち、今日以降の分を削除します（過去の日付の回答は全体状況・CSVに残ります）。よろしいですか？`)) return;
  try{
    const result = await apiPost({ action: 'clearAttendance', month: ym, name });
    if(!result || !result.ok){
      alert('削除に失敗しました。もう一度お試しください。');
      return;
    }
    renderDatesForChild(block); // rebuild with all chips cleared
    alert('今日以降の回答を削除しました。');
    invalidateAttendanceListCache();
    loadSummary();
  }catch(e){
    console.error(e);
    alert('削除に失敗しました。通信エラーの可能性があります。(' + (e.message || e) + ')');
  }
}

async function loadAndApplyExisting(block){
  const nameEl = block.querySelector('.childName');
  const name = nameEl ? nameEl.value.trim() : '';
  const note = block.querySelector('.loadNote');
  if(!name) return;
  const ym = document.getElementById('monthInput').value;
  try{
    const r = await getAttendanceListShared(ym);
    const submissions = r.submissions || [];
    const existing = submissions.find(s => s.name === name);
    if(!existing || !existing.days){
      if(note) note.textContent = '';
      return;
    }
    block.querySelectorAll('.date-row').forEach(row => {
      const ds = row.dataset.date;
      const dayData = existing.days[ds];
      if(!dayData) return;
      row.querySelectorAll('.slot-attend-block').forEach(sb => {
        const idx = sb.dataset.slotIdx;
        const d = dayData['slot' + idx];
        if(!d || !d.status) return;
        const chip = sb.querySelector(`.chip[data-type="${d.status}"]`);
        if(chip && !chip.classList.contains('on')) selectChip(chip);
        if(d.status === 'late' && d.time){ const t = sb.querySelector('.lateTime'); if(t) t.value = d.time; }
        if(d.status === 'early' && d.time){ const t = sb.querySelector('.earlyTime'); if(t) t.value = d.time; }
        if(d.status === 'other' && d.message){ const m = sb.querySelector('.otherMessage'); if(m) m.value = d.message; }
      });
    });
    if(note) note.textContent = '前回の回答を読み込みました。変更したい日だけ直して送信してください。';
  }catch(e){
    console.error(e);
  }
}

function rememberChildNames(){
  try{
    const names = Array.from(document.querySelectorAll('.childName')).map(i => i.value.trim()).filter(Boolean);
    if(names.length) localStorage.setItem('attendanceChildNames', JSON.stringify(names));
  }catch(e){}
}
async function loadAllChildrenForSubmitter(){
  const ym = document.getElementById('monthInput').value;
  let names = [];
  if(lineDisplayName){
    try{
      const r = await getAttendanceListShared(ym);
      const submissions = r.submissions || [];
      const mine = submissions.filter(s => s.submitterLineName === lineDisplayName);
      // unique names, most recently updated first
      const seen = new Set();
      mine.sort((a,b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
      mine.forEach(s => { if(s.name && !seen.has(s.name)){ seen.add(s.name); names.push(s.name); } });
    }catch(e){ console.error(e); }
  }
  if(names.length === 0){
    // 他の団体で入力したお子様の名前を引き継ぐ（兄弟が別団体にいる場合）
    try{
      const saved = JSON.parse(localStorage.getItem('attendanceChildNames') || '[]');
      if(Array.isArray(saved)) names = saved.filter(n => typeof n === 'string' && n);
    }catch(e){}
  }
  if(document.getElementById('childrenContainer').children.length > 0) return; // 通信中に別の処理で作られていたら何もしない
  if(names.length === 0){
    addChild(lineDisplayName || '');
  }else{
    names.forEach(n => addChild(n));
  }
}
function locationBadge(slot){
  if(!slot || !slot.location) return '';
  const label = (slot.location === CUSTOM_LOC && slot.customLocation) ? slot.customLocation : slot.location;
  return `<span class="loc-badge" data-loc="${escapeHtml(slot.location)}">${escapeHtml(label)}</span>`;
}
function categoryBadges(slot){
  if(!slot.categories || slot.categories.length === 0) return '';
  const badges = slot.categories.map(c => {
    const label = (c === 'カスタム' && slot.customCategory) ? slot.customCategory : c;
    return `<span class="cat-badge" data-cat="${escapeHtml(c)}">${escapeHtml(label)}</span>`;
  }).join('');
  const openNote = slot.categories.includes('オープン') ? '<div class="open-note">BC鶴岡・鶴六どちらの所属でも、区分を問わず参加できます。小4以下は保護者の付き添いが条件です。</div>' : '';
  return `<div class="cat-line">${badges}</div>${openNote}`;
}
function coachLine(slot){
  if(!slot.coaches || slot.coaches.length === 0) return '';
  const badges = slot.coaches.map(c => {
    const label = (c === 'カスタム' && slot.customCoach) ? slot.customCoach : c;
    return `<span class="coach-badge" data-coach="${escapeHtml(c)}">${escapeHtml(label)}</span>`;
  }).join('');
  return `<div class="coach-line">責任者: ${badges}</div>`;
}
function formatTimeRange(slot){
  if(slot.allDay) return '終日';
  if(slot.startTime && slot.endTime) return `${slot.startTime}〜${slot.endTime}`;
  if(slot.startTime) return `${slot.startTime}〜`;
  if(slot.endTime) return `〜${slot.endTime}`;
  return '';
}

function addMinutesToTime(timeStr, deltaMinutes){
  if(!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  let total = h * 60 + m + deltaMinutes;
  total = ((total % 1440) + 1440) % 1440;
  const nh = Math.floor(total / 60);
  const nm = total % 60;
  return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
}

function selectChip(el){
  const scope = el.closest('.slot-attend-block');
  const type = el.dataset.type;
  const wasOn = el.classList.contains('on');

  // clear all chips in this slot block, then set only the clicked one (toggle off if tapped again)
  scope.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  scope.querySelectorAll('.time-inline').forEach(t => t.classList.remove('show'));
  scope.querySelectorAll('.other-inline').forEach(t => t.classList.remove('show'));

  if(!wasOn){
    el.classList.add('on');
    if(type === 'late' || type === 'early'){
      scope.querySelector(`.time-inline[data-type="${type}"]`).classList.add('show');
      if(type === 'late'){
        const input = scope.querySelector('.lateTime');
        if(input && !input.value && scope.dataset.start){
          input.value = addMinutesToTime(scope.dataset.start, 30);
        }
      }
      if(type === 'early'){
        const input = scope.querySelector('.earlyTime');
        if(input && !input.value && scope.dataset.end){
          input.value = addMinutesToTime(scope.dataset.end, -60);
        }
      }
    }
    if(type === 'other'){
      scope.querySelector(`.other-inline[data-type="other"]`).classList.add('show');
    }
  }
  const more = scope.querySelector('.chips-more');
  if(more && more.querySelector('.chip.on')) more.classList.add('open');
}
function toggleMore(btn){
  const more = btn.parentElement.querySelector('.chips-more');
  if(more) more.classList.toggle('open');
}
function markAllAttend(id){
  const block = document.getElementById(id);
  if(!block) return;
  block.querySelectorAll('.slot-attend-block').forEach(sb => {
    if(sb.querySelector('.chip.on')) return; // すでに選んだ日は変えない
    const chip = sb.querySelector('.chip[data-type="attend"]');
    if(chip) selectChip(chip);
  });
}

async function submitAll(){
  const ym = document.getElementById('monthInput').value;
  const msg = document.getElementById('statusMsg');
  const blocks = document.querySelectorAll('.child-block');
  if(blocks.length === 0){ msg.textContent = 'お子様を追加してください'; return; }

  msg.textContent = '送信中…';
  let ok = true;
  let errorDetail = '';
  let sentCount = 0;
  let skippedNoName = 0;

  try{
    for(const block of blocks){
      const nameEl = block.querySelector('.childName');
      const name = nameEl ? nameEl.value.trim() : '';
      if(!name){ skippedNoName++; continue; }
      const days = {};
      block.querySelectorAll('.date-row').forEach(row => {
        const ds = row.dataset.date;
        const dayData = {};
        row.querySelectorAll('.slot-attend-block').forEach(sb => {
          const idx = sb.dataset.slotIdx;
          const activeChip = sb.querySelector('.chip.on');
          if(!activeChip) return;
          const status = activeChip.dataset.type; // attend | absent | late | early | other
          const entry = { status };
          if(status === 'late'){
            const t = sb.querySelector('.lateTime');
            entry.time = t ? t.value : null;
          }
          if(status === 'early'){
            const t = sb.querySelector('.earlyTime');
            entry.time = t ? t.value : null;
          }
          if(status === 'other'){
            const m = sb.querySelector('.otherMessage');
            entry.message = m ? m.value.trim() : '';
          }
          dayData['slot' + idx] = entry;
        });
        if(Object.keys(dayData).length > 0) days[ds] = dayData;
      });
      try{
        const result = await apiPost({
          action: 'saveAttendance', month: ym, name,
          submitterLineName: lineDisplayName || null, days
        });
        if(!result || !result.ok){ ok = false; } else { sentCount++; }
      }catch(e){ console.error(e); ok = false; errorDetail = e.message || String(e); }
    }
  }catch(e){
    console.error(e);
    ok = false;
    errorDetail = e.message || String(e);
  }

  if(sentCount === 0 && skippedNoName > 0){
    msg.textContent = 'お名前が入力されていないため送信されていません。「お子様・コーチのお名前」欄を確認してください。';
    return;
  }

  msg.textContent = ok
    ? 'この月の出欠を送信しました。ありがとうございます！'
    : `送信に失敗しました。${errorDetail ? '(' + errorDetail + ')' : 'もう一度お試しください。'}`;
  if(ok) rememberChildNames();
  invalidateAttendanceListCache();
  loadSummary();
}

async function loadSummary(){
  const ym = document.getElementById('monthInput').value;
  const container = document.getElementById('summaryContainer');
  if(practiceDates.length === 0){
    container.innerHTML = '<div class="empty">練習日が設定されていません</div>';
    return;
  }
  try{
    const r = await getAttendanceListShared(ym);
    const submissions = r.submissions || [];
    const others = await getOtherOrgsShared(ym).catch(e => { console.error(e); return []; });
    const anyOther = others.some(o => o.submissions.length > 0);
    if(submissions.length === 0 && !anyOther){
      container.innerHTML = '<div class="empty">まだ回答がありません</div>';
      return;
    }
    let html = `<div class="answered-count">回答済み：${submissions.length}名</div>`;
    const labelMap = { attend: '✓ 出席', absent: '✕ 欠席', late: '⏰ 遅刻', early: '↩ 早退', other: '💬 フリーメッセージ' };
    const statusOrder = ['attend', 'absent', 'late', 'early', 'other'];
    const todayStr = getTodayStr();
    const nextDate = computeNextPracticeDate(practiceDates.map(pd => pd.date));
    for(const pd of practiceDates){
      const ds = pd.date;
      const slotBlocksHtml = pd.slots.map((slot, idx) => {
        const groups = { attend: [], absent: [], late: [], early: [], other: [] };
        // 同じ日・同じ会場で練習する他団体の枠（あれば合同で表示する）
        const matches = [];
        for(const oo of others){
          const opd = oo.practiceDates.find(p => p.date === ds);
          if(!opd) continue;
          opd.slots.forEach((os, oidx) => {
            if(sameVenue(slot, ORG.customLoc, os, ORGS[oo.id].customLoc)) matches.push({ org: ORGS[oo.id], slot: os, idx: oidx, submissions: oo.submissions });
          });
        }
        const tagHtml = (o) => `<span class="org-tag" style="background:${o.theme.navy}">${escapeHtml(o.tab)}</span>`;
        // 同じ名前・同じ出欠は1行にまとめ、団体バッジを並べる（重複所属対応）
        const seen = {};
        const collect = (subs, slotIdx, org) => {
          for(const s of subs){
            const dayData = s.days ? s.days[ds] : null;
            const d = dayData ? dayData['slot' + slotIdx] : null;
            if(!d || !d.status || !groups[d.status]) continue;
            let suffix = '';
            if(d.status === 'late' || d.status === 'early') suffix = d.time ? `(${d.time})` : '';
            if(d.status === 'other') suffix = d.message ? `:${escapeHtml(d.message)}` : '';
            const key = d.status + '|' + s.name + '|' + suffix;
            const render = (tags) => (matches.length ? tags.map(tagHtml).join('') : '') + escapeHtml(s.name) + suffix;
            if(seen[key]){
              if(!seen[key].tags.includes(org)){
                seen[key].tags.push(org);
                groups[d.status][seen[key].i] = render(seen[key].tags);
              }
            } else {
              seen[key] = { tags: [org], i: groups[d.status].length };
              groups[d.status].push(render([org]));
            }
          }
        };
        collect(submissions, idx, ORG);
        matches.forEach(m => collect(m.submissions, m.idx, m.org));
        const mergedNote = matches.length
          ? `<div class="merged-note">合同表示：${[{ org: ORG, slot }, ...matches].map(m => `${escapeHtml(m.org.tab)} ${escapeHtml(formatTimeRange(m.slot))}`).join(' / ')}</div>`
          : '';
        const totalCount = statusOrder.reduce((sum, k) => sum + groups[k].length, 0);
        if(totalCount === 0) return '';
        const timeRange = formatTimeRange(slot);
        const metaLine = (slot.location || timeRange) ? `<div class="date-meta">${locationBadge(slot)}${timeRange ? escapeHtml(timeRange) : ''}</div>` : '';
        const catLine = categoryBadges(slot);
        const coachLn = coachLine(slot);
              const msgLine = slot.message ? `<div class="date-note">🏸 ${escapeHtml(slot.message)}</div>` : '';
        const slotLabel = pd.slots.length > 1 ? `<div class="slot-title">会場${idx + 1}</div>` : '';
        const groupsHtml = statusOrder
          .filter(k => groups[k].length > 0)
          .map(k => `
            <div class="status-group">
              <span class="group-label ${k}">${labelMap[k]}（${groups[k].length}）</span>
              <div class="group-names">${groups[k].map(n => `<div class="name-item">${n}</div>`).join('')}</div>
            </div>
          `).join('');
        return `<div class="slot-color-${idx}">${slotLabel}${metaLine}${mergedNote}${catLine}${coachLn}${schoolNoteBadges(slot)}${msgLine}${groupsHtml}</div>`;
      }).join('');
      if(!slotBlocksHtml.trim()) continue;
      const dutyLine = pd.parentDuty ? `<div class="duty-line">👪 当番: ${escapeHtml(pd.parentDuty)}</div>` : '';
      html += `<div class="summary-date ${dayClassFor(ds)}"><div class="d-title">${dateLabelWithHoliday(ds)}${dateBadgeFor(ds, todayStr, nextDate)}</div>${slotBlocksHtml}${dutyLine}</div>`;
    }
    container.innerHTML = html || '<div class="empty">まだ回答がありません</div>';
  }catch(e){
    console.error(e);
    container.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const LOC_COLORS_PNG = {'六コミ':'#2563EB','武道館':'#7C3AED','宝田':'#0D9488','櫛スポ':'#EA580C','羽黒体':'#16A34A','藤島体':'#DB2777','アリーナ':'#4F46E5','多目的':'#B45309','カスタム':'#57534E','その他':'#57534E'};
const CAT_COLORS_PNG = {'オープン':'#DB2777','1班':'#2563EB','2班':'#7C3AED','3班':'#0D9488','全員':'#16A34A','選抜':'#EA580C','カスタム':'#57534E','部活動':'#2563EB','区分A':'#7C3AED','区分B':'#0D9488','小学生':'#EA580C'};

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

async function exportCalendarPNG(){
  const btn = document.querySelector('.export-png-btn');
  const originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.textContent = '作成中…'; btn.disabled = true; }
  try{
    const ym = document.getElementById('monthInput').value;
    const [yearStr, monthStr] = ym.split('-');
    const year = parseInt(yearStr), month = parseInt(monthStr);
    const total = daysInMonth(ym);
    const offset = firstWeekday(ym);

    let currentSummary = '', nextSummary = '';
    await Promise.all([
      ensureHolidaysLoaded(Array.from({length: total}, (_, i) => dateStr(ym, i+1))),
      apiGet('getMonthSummary', { month: ym }).then(r => {
        currentSummary = r.currentSummary || '';
        nextSummary = r.nextSummary || '';
      }).catch(e => console.error(e))
    ]);

    const practiceByDate = {};
    practiceDates.forEach(pd => { practiceByDate[pd.date] = pd; });

    const CELL_W = 260, CELL_H = 310;
    const GRID_LEFT = 20;
    const TITLE_H = 100;
    const noteBoxH = (text) => {
      const lineCount = Math.max(1, text.split('\n').filter(l=>l.trim()).length);
      return 46 + lineCount*26 + 10;
    };
    let TOP_NOTES_H = 0;
    if(currentSummary.trim() || nextSummary.trim()){
      const curH = currentSummary.trim() ? noteBoxH(currentSummary) : 0;
      const nxtH = nextSummary.trim() ? noteBoxH(nextSummary) : 0;
      TOP_NOTES_H = Math.max(curH, nxtH) + 20;
    }
    const BOTTOM_NOTES_H = 0;
    const DOW_H = 60;
    const rows = Math.ceil((offset + total) / 7);
    const GRID_TOP = 20 + TITLE_H + TOP_NOTES_H + DOW_H + 20;
    const W = GRID_LEFT*2 + CELL_W*7;
    const H = GRID_TOP + CELL_H*rows + BOTTOM_NOTES_H + 24;

    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.textBaseline = 'top';

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = '#2E8B47';
    ctx.lineWidth = 9;
    ctx.strokeRect(5,5,W-10,H-10);

    ctx.fillStyle = '#2E8B47';
    ctx.fillRect(20,20,W-40,TITLE_H);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px "Noto Sans CJK JP", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${year}年${month}月　${ORG.pngTitle}`, W/2, 20+TITLE_H/2+2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    const drawNoteBox = (x, y, boxW, title, text) => {
      const lineCount = Math.max(1, text.split('\n').filter(l=>l.trim()).length);
      const boxH = 46 + lineCount*26 + 10;
      ctx.fillStyle = '#FFF3E0';
      ctx.fillRect(x, y, boxW, boxH);
      ctx.strokeStyle = '#E8871E';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, boxW, boxH);
      ctx.fillStyle = '#E8871E';
      ctx.fillRect(x, y, 7, boxH);
      ctx.font = 'bold 24px "Noto Sans CJK JP", sans-serif';
      ctx.fillText('📌 '+title, x+20, y+10);
      ctx.fillStyle = '#333';
      ctx.font = '19px "Noto Sans CJK JP", sans-serif';
      let ty = y+46;
      text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line => {
        ctx.fillText('・'+line.replace(/^[・\-*]\s*/,''), x+20, ty);
        ty += 26;
      });
      return boxH;
    };

    if(currentSummary.trim() || nextSummary.trim()){
      const notesY = 20+TITLE_H+10;
      if(currentSummary.trim() && nextSummary.trim()){
        const halfW = (W-40-12)/2;
        drawNoteBox(20, notesY, halfW, '今月のお知らせ', currentSummary);
        drawNoteBox(20+halfW+12, notesY, halfW, '来月のお知らせ', nextSummary);
      }else if(currentSummary.trim()){
        drawNoteBox(20, notesY, W-40, '今月のお知らせ', currentSummary);
      }else{
        drawNoteBox(20, notesY, W-40, '来月のお知らせ', nextSummary);
      }
    }

    const DOWN = ['日','月','火','水','木','金','土'];
    for(let i=0;i<7;i++){
      const x0 = GRID_LEFT + i*CELL_W;
      const y0 = GRID_TOP - DOW_H;
      ctx.fillStyle = '#E8871E';
      ctx.fillRect(x0, y0, CELL_W, DOW_H);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(x0,y0,CELL_W,DOW_H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px "Noto Sans CJK JP", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(DOWN[i], x0+CELL_W/2, y0+16);
      ctx.textAlign = 'left';
    }

    const badgePositions = {};
    for(let d=1; d<=total; d++){
      const ds = dateStr(ym, d);
      const cellIndex = offset + d - 1;
      const row = Math.floor(cellIndex/7);
      const col = cellIndex%7;
      const x0 = GRID_LEFT + col*CELL_W;
      const y0 = GRID_TOP + row*CELL_H;
      const pd = practiceByDate[ds];
      const holidayName = holidayNameFor(ds);
      const isSun = col === 0, isSat = col === 6;

      ctx.fillStyle = pd ? '#FFF3A0' : '#ffffff';
      ctx.fillRect(x0,y0,CELL_W,CELL_H);
      ctx.strokeStyle = '#B7D9B0';
      ctx.lineWidth = 4;
      ctx.strokeRect(x0,y0,CELL_W,CELL_H);

      ctx.font = 'bold 30px "Noto Sans CJK JP", sans-serif';
      ctx.fillStyle = (holidayName || isSun) ? '#D0392B' : (isSat ? '#1F5C99' : '#333');
      ctx.fillText(String(d), x0+12, y0+10);
      if(holidayName){
        ctx.font = '14px "Noto Sans CJK JP", sans-serif';
        ctx.fillStyle = '#D0392B';
        ctx.fillText(holidayName, x0+48, y0+18);
      }

      if(pd && pd.slots && pd.slots.length){
        const single = pd.slots.length === 1;
        const F_LOC = single ? 'bold 30px' : 'bold 19px';
        const F_TIME = single ? '28px' : '19px';
        const F_CAT = single ? '21px' : '15px';
        const F_COACH = single ? '24px' : '16px';
        const LOC_PAD_H = single ? 44 : 28;
        const LOC_GAP = single ? 54 : 34;
        const TIME_GAP = single ? 42 : 26;
        const CAT_GAP = single ? 42 : 26;
        const slotH = (CELL_H-50) / pd.slots.length;
        pd.slots.forEach((slot, idx) => {
          const sy = y0+46+idx*slotH;
          let ty = sy;
          const locColor = LOC_COLORS_PNG[slot.location] || '#888';
          ctx.fillStyle = locColor;
          ctx.fillRect(x0+3, sy, 7, slotH-6);

          if(slot.location){
            const label = (slot.location === CUSTOM_LOC && slot.customLocation) ? slot.customLocation : slot.location;
            ctx.font = `${F_LOC} "Noto Sans CJK JP", sans-serif`;
            const tw = ctx.measureText(label).width;
            const locBadgeW = tw+22;
            ctx.fillStyle = locColor;
            roundRectPath(ctx, x0+18, ty, locBadgeW, LOC_PAD_H, 13);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x0+18+locBadgeW/2, ty+LOC_PAD_H/2+1);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            badgePositions[ds] = badgePositions[ds] || [];
            badgePositions[ds].push({
              row, col, location: slot.location, customLocation: slot.customLocation || '',
              categories: slot.categories || [], customCategory: slot.customCategory || '',
              leftX: x0+18, rightX: x0+18+locBadgeW, midY: ty+LOC_PAD_H/2
            });
            ty += LOC_GAP;
          }
          const timeRange = formatTimeRange(slot);
          if(timeRange){
            ctx.font = `${F_TIME} "Noto Sans CJK JP", sans-serif`;
            ctx.fillStyle = '#333';
            ctx.fillText(timeRange, x0+20, ty);
            ty += TIME_GAP;
          }
          if(slot.categories && slot.categories.length){
            let cx = x0+18;
            slot.categories.forEach(cat => {
              const label = (cat === 'カスタム' && slot.customCategory) ? slot.customCategory : cat;
              const color = CAT_COLORS_PNG[cat] || '#888';
              ctx.font = `${F_CAT} "Noto Sans CJK JP", sans-serif`;
              const tw = ctx.measureText(label).width;
              const catBadgeW = tw+14;
              const catBadgeH = single ? 32 : 21;
              ctx.fillStyle = color;
              roundRectPath(ctx, cx, ty, catBadgeW, catBadgeH, 10);
              ctx.fill();
              ctx.fillStyle = '#fff';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(label, cx+catBadgeW/2, ty+catBadgeH/2+1);
              ctx.textAlign = 'left';
              ctx.textBaseline = 'top';
              cx += tw+18;
            });
            ty += CAT_GAP;
          }
          if(slot.coaches && slot.coaches.length){
            const coachLabels = slot.coaches.map(c => (c === 'カスタム' && slot.customCoach) ? slot.customCoach : c);
            ctx.font = `${F_COACH} "Noto Sans CJK JP", sans-serif`;
            ctx.fillStyle = '#333';
            ctx.fillText('責任者:'+coachLabels.join('・'), x0+20, ty);
            ty += TIME_GAP;
          }
          if(slot.message){
            ctx.font = `${F_COACH} "Noto Sans CJK JP", sans-serif`;
            ctx.fillStyle = '#57534E';
            ctx.fillText('🏸 '+slot.message, x0+20, ty);
          }
        });
      }
      if(pd && pd.parentDuty){
        ctx.font = '15px "Noto Sans CJK JP", sans-serif';
        ctx.fillStyle = '#8B5A3C';
        ctx.fillText('👪 '+pd.parentDuty, x0+14, y0+CELL_H-26);
      }
    }

    // Draw connecting arrows between consecutive days with the same venue+categories
    const sameCatSet = (a, b) => {
      const sa = new Set(a||[]), sb = new Set(b||[]);
      if(sa.size !== sb.size) return false;
      for(const x of sa) if(!sb.has(x)) return false;
      return true;
    };
    for(let d=2; d<=total; d++){
      const ds = dateStr(ym, d);
      const dp = new Date(ds + 'T00:00:00');
      dp.setDate(dp.getDate() - 1);
      const prevDs = `${dp.getFullYear()}-${String(dp.getMonth()+1).padStart(2,'0')}-${String(dp.getDate()).padStart(2,'0')}`;
      const todayBadges = badgePositions[ds] || [];
      const prevBadges = badgePositions[prevDs] || [];
      todayBadges.forEach(tb => {
        const sameLocation = (pb, tb) => {
          if(pb.location !== tb.location) return false;
          if(pb.location === CUSTOM_LOC) return pb.customLocation === tb.customLocation;
          return true;
        };
        const sameCategories = (pb, tb) => {
          if(!sameCatSet(pb.categories, tb.categories)) return false;
          if(tb.categories.includes('カスタム')) return pb.customCategory === tb.customCategory;
          return true;
        };
        const match = prevBadges.find(pb => sameLocation(pb, tb) && sameCategories(pb, tb));
        if(!match) return;
        ctx.strokeStyle = '#4B5563';
        ctx.fillStyle = '#4B5563';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        if(match.row === tb.row){
          // same row: straight arrow from previous badge's right edge to today's badge's left edge
          const x1 = match.rightX, y1 = match.midY, x2 = tb.leftX - 10, y2 = tb.midY;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x2+6, y2);
          ctx.lineTo(x2-14, y2-11);
          ctx.lineTo(x2-14, y2+11);
          ctx.closePath();
          ctx.fill();
        }else{
          // row wrap: small arrow icon beside today's badge as a fallback indicator
          ctx.font = 'bold 22px "Noto Sans CJK JP", sans-serif';
          ctx.fillText('↩', tb.rightX+6, tb.midY-11);
        }
      });
    }

    const dataUrl = canvas.toDataURL('image/png');
    lastCalendarPNG = { dataUrl, filename: `${ORG.pngName}_${ym}.png` };
    document.getElementById('pngModalImg').src = dataUrl;
    document.getElementById('pngModal').style.display = 'flex';
  }catch(e){
    console.error(e);
    alert('日程表の作成に失敗しました。(' + (e.message || e) + ')');
  }finally{
    if(btn){ btn.textContent = originalLabel; btn.disabled = false; }
  }
}

async function saveCalendarPNG(){
  if(!lastCalendarPNG) return;
  // Inside LINE's in-app browser, downloads and the share sheet are often blocked.
  // Open the image in the device's external browser (Safari/Chrome) instead, where saving works normally.
  if(typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()){
    try{
      liff.openWindow({ url: lastCalendarPNG.dataUrl, external: true });
      return;
    }catch(e){
      console.error(e);
    }
  }
  try{
    const res = await fetch(lastCalendarPNG.dataUrl);
    const blob = await res.blob();
    const file = new File([blob], lastCalendarPNG.filename, { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: lastCalendarPNG.filename });
      return;
    }
  }catch(e){
    console.error(e);
  }
  // fallback: standard download link (works in regular browsers, may not work inside LINE's in-app browser)
  const a = document.createElement('a');
  a.href = lastCalendarPNG.dataUrl;
  a.download = lastCalendarPNG.filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function bulletize(text){
  return text.split('\n').map(line => line.trim()).filter(Boolean)
    .map(line => `<li>${escapeHtml(line.replace(/^[・\-*]\s*/, ''))}</li>`).join('');
}

// ---------------------------------------------------------------- CSV出力
function csvEscape(v){
  const t = String(v == null ? '' : v);
  return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
async function buildAttendanceCSV(){
  const ym = document.getElementById('monthInput').value;
  invalidateAttendanceListCache();
  const r = await getAttendanceListShared(ym);
  const submissions = r.submissions || [];
  await ensureHolidaysLoaded(practiceDates.map(pd => pd.date));
  const statusLabel = { attend: '出席', absent: '欠席', late: '遅刻', early: '早退', other: 'その他' };
  const header = ['団体', '月', '日付', '曜日', '祝日', '会場No', '会場', '時間', '対象区分', '責任者', '名前', '出欠', '時刻', 'メッセージ', '送信者', '更新日時'];
  const rows = [];
  for(const sub of submissions){
    for(const ds of Object.keys(sub.days || {})){
      const dayData = sub.days[ds] || {};
      const pd = practiceDates.find(p => p.date === ds);
      for(const key of Object.keys(dayData)){
        const idx = parseInt(key.replace('slot', ''), 10);
        const d = dayData[key];
        if(!d || !d.status) continue;
        const slot = pd && pd.slots[idx] ? pd.slots[idx] : null;
        const loc = slot ? ((slot.location === CUSTOM_LOC && slot.customLocation) ? slot.customLocation : slot.location) : '';
        const cats = slot ? (slot.categories || []).map(c => (c === 'カスタム' && slot.customCategory) ? slot.customCategory : c).join('・') : '';
        const coaches = slot ? (slot.coaches || []).map(c => (c === 'カスタム' && slot.customCoach) ? slot.customCoach : c).join('・') : '';
        rows.push({
          sortKey: ds + '|' + String(idx).padStart(2, '0') + '|' + sub.name,
          cols: [ORG.tab, ym, ds, weekdayOf(ds), holidayNameFor(ds) || '', idx + 1, loc, slot ? formatTimeRange(slot) : '', cats, coaches,
                 sub.name, statusLabel[d.status] || d.status, d.time || '', d.message || '', sub.submitterLineName || '', sub.updatedAt || '']
        });
      }
    }
  }
  rows.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
  const lines = [header, ...rows.map(r => r.cols)].map(cols => cols.map(csvEscape).join(','));
  return { text: lines.join('\r\n'), count: rows.length, filename: `${ORG.tab}_出欠_${ym}.csv` };
}
async function downloadCSV(){
  try{
    const csv = await buildAttendanceCSV();
    if(csv.count === 0){ alert('この月の回答がまだありません。'); return; }
    const blob = new Blob(['﻿' + csv.text], { type: 'text/csv;charset=utf-8' });
    const file = new File([blob], csv.filename, { type: 'text/csv' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{ await navigator.share({ files: [file], title: csv.filename }); return; }catch(e){ if(e && e.name === 'AbortError') return; }
    }
    const inLine = typeof liff !== 'undefined' && liff.isInClient && liff.isInClient();
    if(inLine){
      alert('LINEアプリの中ではダウンロードできないことがあります。うまくいかない時は「CSVをコピー」を使うか、Safari/Chromeでこのページを開いてください。');
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = csv.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }catch(e){
    console.error(e);
    alert('CSVの作成に失敗しました。(' + (e.message || e) + ')');
  }
}
async function copyCSV(){
  try{
    const csv = await buildAttendanceCSV();
    if(csv.count === 0){ alert('この月の回答がまだありません。'); return; }
    try{
      await navigator.clipboard.writeText(csv.text);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = csv.text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    alert(`${csv.count}行のCSVをコピーしました。メモ帳やスプレッドシートに貼り付けてください。`);
  }catch(e){
    console.error(e);
    alert('CSVのコピーに失敗しました。(' + (e.message || e) + ')');
  }
}

async function initLiff(){
  const greeting = document.getElementById('userGreeting');
  try{
    if(typeof liff === 'undefined'){
      greeting.textContent = 'お子様・コーチのお名前を入力してください';
      return;
    }
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){
      // LINEアプリの外（ホーム画面から開いた場合など）はLINEログインへ飛ばさず、名前の自由入力で使う
      if(liff.isInClient && liff.isInClient()){ liff.login(); return; }
      greeting.textContent = 'お子様・コーチのお名前を入力してください';
      return;
    }
    const profile = await liff.getProfile();
    lineDisplayName = profile.displayName;
    greeting.textContent = `${profile.displayName} さん、こんにちは`;
  }catch(e){
    console.warn('LIFF init skipped (プレビュー環境):', e);
    greeting.textContent = 'お子様・コーチのお名前を入力してください';
  }
}

  if(!isFirebaseConfigured()){

    document.querySelector('.wrap').insertBefore(banner, document.getElementById('orgTabs'));
  }
  initFirebase();
  // ?org=skh / LIFFの liff.state=?org=skh で団体を指定 → 前回の団体 → BC鶴岡
  const params = new URLSearchParams(location.search);
  const stateMatch = /org=([a-z]+)/.exec(params.get('liff.state') || '');
  const wanted = params.get('org') || (stateMatch && stateMatch[1]);
  let saved = null;
  try{ saved = localStorage.getItem('attendanceOrg'); }catch(e){}
  applyOrg(ORGS[wanted] ? wanted : (ORGS[saved] ? saved : 'bc'));
  liffReadyPromise = initLiff();   // LINEの初期化とFirestoreの読み込みを同時に走らせる
  loadPracticeDates();
})();
